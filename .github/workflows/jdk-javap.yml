name: JDK javap (diagnostic)

# Prints the bytecode of the JDK classes that the Nabu runtime patches (thread locals, Striped64), to compare JDK
# patch releases. By hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: javap
        run: |
          mkdir out
          java -version 2> out/version.txt
          for c in java.lang.ThreadLocal 'java.lang.ThreadLocal$ThreadLocalMap' java.lang.Thread java.util.concurrent.atomic.Striped64 java.lang.InheritableThreadLocal; do
            javap -p -c -constants "$c" > "out/$c.txt"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: javap
          path: out/*
