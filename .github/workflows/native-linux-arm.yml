name: Native tests on Linux aarch64

# Linux on arm64 is not part of the release yet. This job runs the native thread tests there by hand.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Failsafe test selection (-Dit.test)'
        default: 'ThreadsE2eIT'
      forks:
        description: 'Test processes in parallel (-Dit.forks)'
        default: '1'
      unit:
        description: 'Surefire test selection (-Dtest); NoSuch runs none'
        default: 'NoSuch'
      jvmargs:
        description: 'Extra JVM arguments for the test processes (-DargLine), e.g. -Dnabu.llvm.chunkInstructions=20000 -Dnabu.llvm.emitWorkers=2'
        default: ''
      envvars:
        description: 'Environment variables for the tests, separated by spaces (for example NABU_TRACE_EPOLL=1)'
        default: ''

permissions:
  contents: read

jobs:
  threads:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: C toolchain and libgc
        run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev unzip

      - name: Run the native tests
        timeout-minutes: 120
        env:
          ENVVARS: ${{ inputs.envvars }}
          JVMARGS: ${{ inputs.jvmargs }}
        run: >
          if [ -n "$ENVVARS" ]; then export $ENVVARS; fi &&
          mvn -B verify -pl native-backend -am -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false -Dtest='${{ inputs.unit }}' -Dit.test='${{ inputs.tests }}' -Djavacpp.platform=linux-arm64 -Dit.forks=${{ inputs.forks }}
          "-DargLine=$JVMARGS"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: native-backend/target/failsafe-reports/*
          if-no-files-found: ignore
