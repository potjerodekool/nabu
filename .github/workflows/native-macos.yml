name: Native tests on macOS

# macOS is not part of the release yet. This job runs the native thread tests there by hand (continuations are off by
# default on macOS until they pass here: the tests that need them set NABU_CONTINUATIONS=1 themselves).
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Failsafe test selection (-Dit.test)'
        default: 'ThreadsE2eIT'
      forks:
        description: 'Test processes in parallel (-Dit.forks)'
        default: '1'
      hanghunt:
        description: 'Names of programs (separated by spaces) to run 8 at a time; one that is still running after 30 s gets a backtrace of all threads'
        default: ''
      crashhunt:
        description: 'Run the kept executable many times in parallel under lldb and show the crashes'
        default: 'false'

permissions:
  contents: read

jobs:
  threads:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Boehm GC
        run: brew install bdw-gc

      - name: Compile the runtime (quick feedback on C errors)
        run: |
          cd runtime
          for f in nabu_runtime.c jcl_lite.c; do
            clang -c -w -DNABU_GC_BOEHM -I/opt/homebrew/include "$f" -o /dev/null -ferror-limit=0 2> "$f.errors" || true
            echo "== $f: $(grep -c 'error:' "$f.errors") errors"; grep 'error:' "$f.errors" | head -60
          done
          clang -c -w -DNABU_GC_BOEHM -I/opt/homebrew/include nabu_runtime.c -o /dev/null
          clang -c -w -DNABU_GC_BOEHM -I/opt/homebrew/include jcl_lite.c -o /dev/null

      - name: Make room for the kept executable
        run: mkdir -p "$RUNNER_TEMP/keep"

      - name: Run the native tests
        timeout-minutes: 120
        run: >
          mvn -B verify -pl native-backend -am -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
          -Dtest=NoSuch -Dit.test='${{ inputs.tests }}' -Djavacpp.platform=macosx-arm64 -Dit.forks=${{ inputs.forks }}
          -DargLine="-Dnabu.keepExe=$RUNNER_TEMP/keep/threads.exe"
        env:
          C_INCLUDE_PATH: /opt/homebrew/include
          LIBRARY_PATH: /opt/homebrew/lib

      - name: Run the kept executable under lldb
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          cd "$RUNNER_TEMP/keep" || exit 0
          ls -la
          cat threads.exe.warnings.txt 2>/dev/null | head -20
          for conts in 0 1; do
            echo "=== NABU_CONTINUATIONS=$conts"
            NABU_TRACE_UNSAFE=1 NABU_CONTINUATIONS=$conts NABU_CPUS=3 ./threads.exe cpuCount; echo "exit $?"
          done
          limited() { "$@" & pid=$!; ( sleep 100; kill -9 $pid 2>/dev/null ) & watcher=$!; wait $pid; code=$?; kill $watcher 2>/dev/null; echo "[exit $code]"; }
          exit 0

      - name: Crash hunt
        if: always() && inputs.crashhunt == 'true'
        timeout-minutes: 30
        run: |
          set +e
          cd "$RUNNER_TEMP/keep" || exit 0
          echo "== plain, 8 at a time"
          for round in $(seq 1 25); do
            for i in 1 2 3 4 5 6 7 8; do
              ( NABU_CONTINUATIONS=1 ./threads.exe abandonedParkedVirtualThreads > "plain.$round.$i.txt" 2>&1; echo "$?" > "plain.$round.$i.exit" ) &
            done
            wait
          done
          cat plain.*.exit | sort | uniq -c
          echo "== under lldb, 8 at a time"
          for round in $(seq 1 15); do
            for i in 1 2 3 4 5 6 7 8; do
              ( NABU_CONTINUATIONS=1 lldb -b -o run -k "thread backtrace all" -k "register read" -k "quit" -- ./threads.exe abandonedParkedVirtualThreads > "hunt.$round.$i.txt" 2>&1 ) &
            done
            wait
          done
          for f in $(grep -l "stop reason" hunt.*.txt | head -3); do echo "=== $f"; grep -v '^$' "$f" | head -120; done
          echo "lldb crashes: $(grep -l 'stop reason' hunt.*.txt | wc -l) of $(ls hunt.*.txt | wc -l)"
          exit 0

      - name: Hang hunt
        if: always() && inputs.hanghunt != ''
        timeout-minutes: 40
        run: |
          set +e
          cd "$RUNNER_TEMP/keep" || exit 0
          for prog in ${{ inputs.hanghunt }}; do
            hangs=0
            for round in $(seq 1 4); do
              pids=""
              for i in 1 2 3 4 5 6 7 8; do
                NABU_CONTINUATIONS=1 ./threads.exe "$prog" > "hang.$prog.$round.$i.out" 2>&1 &
                pids="$pids $!"
              done
              sleep 30
              for pid in $pids; do
                if kill -0 $pid 2>/dev/null; then
                  hangs=$((hangs+1))
                  if [ $hangs -le 1 ]; then
                    echo "=== $prog: hang $hangs (round $round, pid $pid)"
                    sudo lldb -p $pid -b -o "thread backtrace all" -o "detach" 2>&1 | grep -v '^$' | cut -c1-200 | head -250
                  fi
                  kill -9 $pid 2>/dev/null
                fi
              done
              wait
            done
            echo "RESULT $prog: $hangs of 32 still running after 30 s"
          done
          exit 0

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: native-backend/target/failsafe-reports/*
          if-no-files-found: ignore
