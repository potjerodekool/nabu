name: Native tests on macOS

# macOS is not part of the release yet. This job runs the native thread tests there by hand (continuations are off by
# default on macOS until they pass here: the tests that need them set NABU_CONTINUATIONS=1 themselves).
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Failsafe test selection (-Dit.test)'
        default: 'ThreadsE2eIT#cpuCount'

permissions:
  contents: read

jobs:
  threads:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Boehm GC
        run: brew install bdw-gc

      - name: Compile the runtime (quick feedback on C errors)
        run: |
          cd runtime
          for f in nabu_runtime.c jcl_lite.c; do
            clang -c -w -DNABU_GC_BOEHM -I/opt/homebrew/include "$f" -o /dev/null -ferror-limit=0 2> "$f.errors" || true
            echo "== $f: $(grep -c 'error:' "$f.errors") errors"; grep 'error:' "$f.errors" | head -60
          done
          clang -c -w -DNABU_GC_BOEHM -I/opt/homebrew/include nabu_runtime.c -o /dev/null
          clang -c -w -DNABU_GC_BOEHM -I/opt/homebrew/include jcl_lite.c -o /dev/null

      - name: Make room for the kept executable
        run: mkdir -p "$RUNNER_TEMP/keep"

      - name: Run the native tests
        timeout-minutes: 120
        run: >
          mvn -B verify -pl native-backend -am -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
          -Dtest=NoSuch -Dit.test='${{ inputs.tests }}' -Djavacpp.platform=macosx-arm64
          -DargLine="-Dnabu.keepExe=$RUNNER_TEMP/keep/threads.exe"
        env:
          C_INCLUDE_PATH: /opt/homebrew/include
          LIBRARY_PATH: /opt/homebrew/lib

      - name: Run the kept executable under lldb
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          cd "$RUNNER_TEMP/keep" || exit 0
          ls -la
          cat threads.exe.warnings.txt 2>/dev/null | head -20
          for conts in 0 1; do
            echo "=== NABU_CONTINUATIONS=$conts"
            NABU_TRACE_UNSAFE=1 NABU_CONTINUATIONS=$conts NABU_CPUS=3 ./threads.exe cpuCount; echo "exit $?"
          done
          limited() { "$@" & pid=$!; ( sleep 100; kill -9 $pid 2>/dev/null ) & watcher=$!; wait $pid; code=$?; kill $watcher 2>/dev/null; echo "[exit $code]"; }
          echo "=== abandoned"
          NABU_TRACE_STACKS=1 NABU_CONTINUATIONS=1 limited ./threads.exe abandonedParkedVirtualThreads 2>&1 | grep -E "^collected|^stacks|exit|parked" | awk 'NR%3==1 || /collected|exit|parked/' | head -60
          exit 0

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: native-backend/target/failsafe-reports/*
          if-no-files-found: ignore
